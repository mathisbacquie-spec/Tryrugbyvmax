<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUGBY AUCTION MULTI</title><style>
:root{font-family:system-ui,sans-serif;background:#091922;color:#e9f6f1}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:20px}h1{font-size:clamp(28px,6vw,45px);margin:10px 0}h2{margin:8px 0}button,input{font:inherit;padding:12px;border-radius:10px}button{background:#8bf0b5;color:#10251f;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.35;cursor:default}input{max-width:160px;background:#fff;color:#10251f;border:0;text-transform:uppercase}.panel{background:#16313b;border:1px solid #33545b;padding:18px;border-radius:16px;margin:14px 0}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{background:#102731;padding:14px;border-radius:12px}.active{outline:2px solid #8bf0b5}.money{font-size:28px;color:#8bf0b5;font-weight:900}.center{text-align:center}.name{font-size:clamp(24px,6vw,40px);font-weight:900}.price{font-size:38px;color:#ffda85;font-weight:900}.clock{font-size:34px;font-weight:900}.urgent{color:#ff8a7e}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.small{font-size:13px;color:#bdd2d0}.group{margin-top:12px}.group b{color:#8bf0b5}.item{font-size:13px;padding:4px 0}.code{font-size:28px;font-weight:900;letter-spacing:.15em;color:#ffda85}#game{display:none}#setup{display:block}@media(max-width:520px){main{padding:12px}.teams{gap:8px}.team{padding:10px}.panel{padding:13px}}
</style></head><body><main><h1>🏉 RUGBY AUCTION <span class="small">MULTI</span></h1><div id="setup" class="panel"><h2>Jouer sur deux téléphones</h2><p>Le joueur 1 crée un salon. Le joueur 2 rejoint avec le code à 6 caractères.</p><div class="actions"><input id="pseudo" maxlength="20" placeholder="Ton pseudo" aria-label="Ton pseudo" style="text-transform:none" autocomplete="nickname"><button onclick="joinGame('create')">Créer un salon</button><input id="joincode" maxlength="6" placeholder="Code salon" aria-label="Code salon"><button onclick="joinGame('join')">Rejoindre</button></div></div><div id="game"><div class="panel center"><div id="role"></div><div class="code" id="code"></div><p id="presence" class="small"></p><button id="start" onclick="send('start')">Lancer la partie</button></div><div class="panel center"><div class="small" id="count"></div><div class="name" id="name">En attente</div><div id="details" class="small"></div><div class="price" id="price"></div><div class="clock" id="clock"></div><p id="notice"></p><div class="actions"><button id="bid" onclick="send('bid')">Enchérir +1 €</button><button id="pass" onclick="send('pass')">Passer</button><button id="next" onclick="send('next')">Joueur suivant →</button><button id="replay" style="display:none" onclick="send('replay')">🔄 Rejouer une partie</button></div></div><div class="teams"><div class="team" id="team0"><h2 id="teamname0">Joueur 1</h2><div class="money" id="budget0"></div><div id="roster0"></div></div><div class="team" id="team1"><h2 id="teamname1">Joueur 2</h2><div class="money" id="budget1"></div><div id="roster1"></div></div></div><p class="small">500 joueurs dans la base · 12 tirés au sort (6 avants / 6 trois-quarts) · 20 € par joueur · 6 recrues max · 15 secondes par tour.</p></div><p class="small" id="error"></p></main><script>
let socket,seat=null,state=null;
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function joinGame(action){const name=$('pseudo').value.trim();if(!name){$('error').textContent='Choisis un pseudo pour jouer.';return} $('error').textContent='';send(action,{name,code:$('joincode').value})}
function playerName(i){return state?.names?.[i]||'Joueur '+(i+1)}
function connect(){socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');socket.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='seat'){seat=d.seat;$('setup').style.display='none';$('game').style.display='block';$('role').textContent='Tu es le joueur '+(seat+1);$('code').textContent=d.code}else if(d.type==='state'){state=d;render()}else if(d.type==='error'){$('error').textContent=d.message}};socket.onclose=()=>{$('error').textContent='Connexion interrompue. Recharge la page pour recréer ou rejoindre un salon.'};}
let queue=[];function send(action,more={}){const msg={action,...more};if(!socket||socket.readyState===WebSocket.CLOSED){connect();queue.push(msg)}else if(socket.readyState===WebSocket.CONNECTING)queue.push(msg);else socket.send(JSON.stringify(msg))}
connect();socket.addEventListener('open',()=>{queue.splice(0).forEach(x=>socket.send(JSON.stringify(x)))})
function isForward(p){return /pilier|talonneur|ligne|flanker|number 8|lock|prop|hooker|forward/i.test(p.poste||'')}
function render(){if(!state)return;const d=state;$('presence').textContent=d.connected.map((x,i)=>playerName(i)+' : '+(x?'connecté':'absent')).join(' · ');$('role').textContent='Tu es '+playerName(seat)+' (joueur '+(seat+1)+')';$('start').style.display=seat===0&&!d.started?'':'none';$('start').disabled=!d.connected.every(Boolean);$('count').textContent=d.started?'Joueur proposé '+Math.min(d.index+1,12)+' / 12':'En attente du lancement';$('name').textContent=d.finished?'Partie terminée':d.player?.nom||'En attente du joueur 2';$('details').textContent=d.player?[d.player.poste,d.player.club,d.player.nationalite].filter(Boolean).join(' · '):'';$('price').textContent=d.started&&!d.finished?(d.price?d.price+' €':'Ouverture : 1 €'):'';$('notice').textContent=(d.finished?(seat===0?(d.connected.every(Boolean)?'Partie terminée ! Clique sur Rejouer pour une nouvelle partie.':'En attente de la reconnexion du joueur 2.'): 'Partie terminée ! Attends que le joueur 1 clique sur Rejouer.') :d.notice)+(d.started&&!d.done&&!d.finished?' · '+(d.turn===seat?'À ton tour !':'Tour de '+playerName(d.turn)):'');$('bid').style.display=d.started&&!d.done&&!d.finished?'':'none';$('pass').style.display=d.started&&!d.done&&!d.finished?'':'none';$('next').style.display=d.done&&!d.finished&&seat===0?'':'none';$('replay').style.display=d.finished&&seat===0?'':'none';$('replay').disabled=!d.connected.every(Boolean);$('bid').disabled=d.turn!==seat||d.teams[seat].length>=6||d.budgets[seat]<d.price+1;$('bid').textContent=d.price===0?'Ouvrir à 1 €':'Sur-enchérir +1 €';$('pass').disabled=d.turn!==seat||d.price===0;for(let i=0;i<2;i++){$('teamname'+i).textContent=playerName(i);$('budget'+i).textContent=d.budgets[i]+' € · '+d.teams[i].length+'/6 joueurs';$('team'+i).classList.toggle('active',d.started&&!d.done&&!d.finished&&d.turn===i);$('roster'+i).innerHTML=[['🏉 Avants',d.teams[i].filter(isForward)],['⚡ Trois-quarts',d.teams[i].filter(p=>!isForward(p))]].map(([title,ps])=>'<div class="group"><b>'+title+' ('+ps.length+')</b>'+(ps.length?ps.map(p=>'<div class="item">'+esc(p.nom)+' <span class="small">'+esc(p.poste)+'</span></div>').join(''):'<div class="small">Aucun</div>')+'</div>').join('')}}
setInterval(()=>{if(!state||!state.started||state.done||state.finished||!state.deadline){$('clock').textContent='';return}const sec=Math.max(0,Math.ceil(state.deadline-Date.now()/1000));$('clock').textContent='⏱️ '+sec+' s';$('clock').classList.toggle('urgent',sec<=5)},150);
</script></body></html>
